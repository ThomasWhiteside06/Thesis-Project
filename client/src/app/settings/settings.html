<div id = 'page'>
    <h1 id = 'title'>Settings:</h1>
    <div id = 'settings-container'>
        <div class = 'setting-container'>
            <h2 class = 'subtitle'>Theme:</h2>
            <button id = 'theme-button' (click)="toggleTheme()">{{ themeService.darkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode' }}</button>
        </div>
        <div class = 'setting-container'>
            <h2 class = 'subtitle'>Currency:</h2>
            <select [(ngModel)] = 'selectedCurrency'>
                <option
                    *ngFor = 'let currency of currencies'
                    [value] = 'currency.code'>
                    {{ currency.code }} - {{ currency.symbol }} - {{ currency.name }}
                </option>
            </select>
        </div>
        <div class = 'setting-container'>
            <h2 class = 'subtitle'>Update Details:</h2>
            <form #form = 'ngForm' (ngSubmit) = 'submitForm(form)'>
                <div class = 'form-group'>
                    <label for = 'email'>Email:</label>
                    <input type = 'email' name = 'email' [(ngModel)] = 'email' required>
                </div>
                <div class = 'form-group'>
                    <label for = 'password'>Password:</label>
                    <input type = 'password' name = 'password' [(ngModel)] = 'password' required>
                </div>
                <div class = 'form-group'>
                    <label for = 'forename'>Forename:</label>
                    <input type = 'forename' name = 'forename' [(ngModel)] = 'forename' required>
                </div>
                <div class = 'form-group'>
                    <label for = 'surname'>Surname:</label>
                    <input type = 'surname' name = 'surname' [(ngModel)] = 'surname' required>
                </div>
                <button type = 'submit'>Submit</button>
            </form>
        </div>
    </div>
</div>
